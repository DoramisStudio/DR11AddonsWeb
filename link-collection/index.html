        <title>Kumpulan link DR11 Addons</title>
        <style>
            html {
                background: rgb(16 16 16);
                color: white;
                user-select: none;
                font-family: "Rubik", sans-serif;
            }

            ::-webkit-scrollbar {
                width: 0px;
            }

            body {
                margin: 4rem;
                padding: unset;
            }

            * {
                margin: unset;
                padding: unset;
            }

            .heading {
                position: relative;
                overflow: hidden;
                border-radius: 8px;
                padding: 2px;
                box-shadow: 0px 4px 8px 0px rgb(0 0 0 / 25%);

                .bg {
                    position: absolute;
                    top: 0px;
                    left: 0px;
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    z-index: -1;
                }

                h1 {
                    padding: 1.5rem 2rem;
                    backdrop-filter: brightness(0.5);
                    border-radius: 6px;
                    text-shadow: 0px 4px 8px rgb(0 0 0 / 25%);
                }
            }

            .wrapper {
                display: flex;
                flex-direction: column;
                gap: 1rem;

                hr {
                    border-color: rgb(255 255 255 / 25%);
                }

                .segment {
                    display: flex;
                    flex-direction: row;
                    align-items: last baseline;
                    gap: 1rem;

                    hr {
                        flex: 1;
                        height: 2px;
                        border: unset;
                        background: rgb(255 255 255 / 25%);
                    }
                }
            }

            .grid-container {
                display: flex;
                flex-direction: column;
                gap: 1rem;

                .tab-buttons {
                    position: sticky;
                    top: 1rem;
                    margin: auto;
                    width: fit-content;
                    display: flex;
                    flex-direction: row;
                    flex-wrap: wrap;
                    gap: 0.5rem;
                    padding: 0.75rem;
                    background: rgb(16 16 16 / 0.75);
                    backdrop-filter: blur(20px);
                    border: 1px solid rgb(32 32 32);
                    border-radius: 28px;
                    z-index: 1;

                    button {
                        border-radius: 16px;
                        justify-content: center;
                        min-width: 120px;
                        flex: 1;
                        outline: unset;
                    }
                }

                .tab-pages {
                    display: flex;
                    flex-direction: column;
                    gap: 1rem;
                    
                    .page {
                        display: none;
                    }
                    .page.active {
                        display: flex;
                        flex-direction: column;
                        gap: 1rem;
                    }
                }

                .grid {
                    position: relative;
                    display: flex;
                    flex-wrap: wrap;
                    gap: 1rem;
                }
                .grid > div {
                    position: relative;
                    padding: 2rem 0rem;
                    border: 1px solid rgb(48 48 48);
                    border-radius: 16px;
                    height: 420px;
                    flex: 1;
                    flex-basis: 320px;
                    cursor: pointer;
                    overflow: hidden;

                    display: flex;
                    flex-direction: column;
                    transition: 0.5s;

                    img {
                        position: absolute;
                        top: 0px;
                        left: 0px;
                        right: 0px;
                        bottom: 0px;
                        width: 100%;
                        height: 100%;
                        opacity: 0.5;
                        z-index: -1;
                        object-fit: cover;
                        transition: 0.5s;
                    }

                    h2 {
                        flex: 1;
                        margin: 0rem 2rem;
                    }

                    .desc {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        gap: 1rem;
                        padding: 0rem 2rem;
                        line-height: 140%;
                        transform: translateY(2rem);
                        transition: padding 0.5s cubic-bezier(.6,0,.3,1);
                        background-image: linear-gradient(to bottom, transparent 0%, rgb(0 0 0 / 0.75) 100%);

                        h3 {
                            opacity: 0.5;
                            font-size: 16px;
                            font-weight: 400;
                        }
                        p {
                            font-size: 22px;
                            font-weight: 600;
                            line-height: 120%;
                        }
                        a {
                            position: relative;
                            display: flex;
                            flex-direction: row;
                            align-items: center;
                            font-size: 16px;
                            gap: 0.5rem;
                            color: rgb(255, 190, 42);
                            opacity: 0;
                            width: fit-content;
                            transition: opacity 0.5s cubic-bezier(.6,0,.3,1);
                        }
                        a::before {
                            content: '';
                            position: absolute;
                            bottom: -4px;
                            left: 0px;
                            height: 2px;
                            width: 0%;
                            background: rgb(255, 190, 42);
                            transition: 1s cubic-bezier(.6,0,.3,1);
                        }
                        a::after {
                            content: '';
                            position: absolute;
                            right: -1rem;
                            top: 0px;
                            bottom: 0px;
                            margin: auto;
                            width: 4px;
                            height: 4px;
                            border: 1.5px solid rgb(255, 190, 42);
                            border-left: unset;
                            border-bottom: unset;
                            transform: rotate(45deg);
                        }
                    }
                }
                .grid > div:hover {
                    padding-bottom: 2rem;
                    border-color: rgb(128 128 128);
                    background: rgb(255 255 255 / 0.1);
                    box-shadow: 0px 4px 8px 0px rgb(0 0 0 / 25%);

                    .desc {
                        padding-bottom: 2rem;
                        /* transform: translateY(0rem); */
                        a {
                            opacity: 1;
                        }
                        a::before {

                            width: 100%;
                        }
                    }

                    img {
                        opacity: 1;
                    }
                }
                .grid > div.hide-more {
                    display: none;
                }
                .grid.more > div.hide-more {
                    display: flex!important;
                }
                .grid.more > div.hide-at-more {
                    display: none;
                }
                
                .grid > div.nofill-image {
                    img {
                        object-fit: unset;
                        padding: 0%;
                        width: fit-content;
                        max-width: 100%;
                        object-fit: cover;
                        margin: 0px auto;
                    }
                }
            }

            button {
                position: relative;
                background: transparent;
                border: 1px solid rgb(64 64 64);
                /* outline: 16px solid transparent;
                outline-offset: -1px; */
                box-shadow: 0px 4px 8px 0px rgb(0 0 0 / 15%);
                color: white;
                padding: 0.5rem 0.8rem;
                border-radius: 4px;
                font-family: "Rubik", sans-serif;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                cursor: pointer;
                overflow: hidden;
                z-index: 0;
                transition: 0.1s, outline .2s ease-out;
            }
            button:hover {
                background: rgb(48 48 48);
                border-color: rgb(128 128 128);
                box-shadow: 0px 0px 24px 0px rgb(255 255 255 / 10%);
            }
            button::before {
                content: '';
                position: absolute;
                top: 0px;
                left: -1rem;
                right: 100%;
                bottom: 0px;
                border-radius: 1rem;
                background: white;
                transition: 0.1s linear;
                z-index: -1;
            }
            button.selected {
                border-color: rgb(128 128 128);
                color: black;
                /* outline-width: 1px;
                outline-color: rgb(128 128 128); */
            }
            button.selected::before {
                right: 0%;
            }


            .dialog {
                position: fixed;
                top: 0px;
                left: 0px;
                right: 0px;
                bottom: 0px;
                z-index: 25;
                transition: .3s ease;

                .bbox {
                    position: absolute;
                    top: 0px;
                    left: 0px;
                    right: 0px;
                    bottom: 0px;
                    background: rgb(0 0 0 / .5);
                    z-index: 1;
                }

                .dialog-content {
                    position: absolute;
                    top: 0px;
                    left: 0px;
                    right: 0px;
                    bottom: 0px;
                    z-index: 2;
                    width: 24rem;
                    height: fit-content;
                    margin: auto;
                    background: rgb(24 24 24);
                    border: 1px solid rgb(255 255 255 / .05);
                    box-shadow: 0px 8px 16px 0px rgb(0 0 0 / .25);
                    padding: 1rem;
                    border-radius: 1rem;
                    display: flex;
                    flex-direction: column;
                    gap: .5rem;

                    a {
                        color: gray;
                    }
                    a:hover {
                        color: white;
                    }

                    hr {
                        opacity: .15;
                    }
                }
            }
            .dialog.hidden {
                opacity: 0;
                transform: scale(.95);
                pointer-events: none;
            }

            .link-list {
                display: flex;
                flex-direction: column;
                background: rgb(0 0 0 / .25);
                border: 1px solid rgb(255 255 255 / .1);
                padding: .5rem;
                border-radius: .5rem;

                .item {
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    justify-content: space-between;
                    padding: .5rem;
                    border-radius: .25rem;
                    gap: .5rem;
                    cursor: pointer;
                }
                .item:hover {
                    background: rgb(255 255 255 / .05);

                    .underline-hover {
                        text-decoration: underline;
                    }
                }
                .item * {
                    white-space: pre;
                }

                .overflow {
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

                p.link-small {
                    font-size: small;
                    opacity: .25;
                }
            }

            .bg-top {
                position: fixed;
                top: 0px;
                left: 0px;
                right: 0px;
                bottom: 0px;
                width: 100%;
                height: 100%;
                object-fit: cover;
                z-index: -1;
                opacity: 0.1;
            }
        </style>
    </head>
    <body>
        <img class="bg-top" src="https://i.idol.st/u/sif2/card/art/566UR-Emma-Verde-Pure-%E3%83%91%E3%83%B3%E3%81%AA%E3%82%89%E3%81%84%E3%81%8F%E3%82%89%E3%81%A7%E3%82%82-qmGvS6.png">
        <div class="wrapper">
            <div>
                <button onclick="location.assign('/');"><span class="material-symbols-rounded mat4" style="font-size: 14px;" translate="no">chevron_left</span> Kembali ke halaman utama</button>
            </div>
            <div class="heading">
                <img src="https://i.idol.st/u/background/1710Background-J4hyVF.png" class="bg"></img>
                <h1>Kumpulan Link DR11 Addons</h1>
            </div>
            <p>Tempat penampungan link DR11 Addons selain di pastebin 😅</p>
            <hr>
            <div class="grid-container">
                <div class="tab-buttons">
                </div>
                <div class="tab-pages">

                </div>
            </div>
        </div>

        <div class="dialog hidden" id="dialog_linkList">
            <div class="bbox"></div>
            <div class="dialog-content">
                <div>
                    <p>Daftar Link / <b id="dialog_linkListTitle"></b></p>
                </div>
                <hr class="w">
                <p id="dialog_linkListDesc"></p>
                <div class="link-list" id="dialog_linkListList">
                </div>
            </div>
        </div>

        <script>
            Array.from(document.querySelector(".tab-buttons").children).forEach((e, i) => {
                // if (e.classList.contains("selected")) {

                // else {

                //     Array.from(document.querySelectorAll(".selectables")).forEach(f => {

                //             f.style.display = "flex";
                //             e.classList.add("selected");

                //             Array.from(document.querySelector(".tab-buttons").children).filter(p => p.getAttribute("name") != att).forEach(g => {
                //                 g.classList.remove("selected");

                //     });

            });

            function prepareDialog(dialog, hideOnOffsideTouch = true) {
                var _events = {};

                function on(event, listener) {
                    if (!_events[event]) {
                        _events[event] = [];
                    }
                    _events[event].push(listener);
                }
                function off(event, listener) {
                    if (!_events[event]) return;
                    _events[event] = _events[event].filter(l => l !== listener);
                }
                function emit(event, data) {
                    if (!_events[event]) return;
                    _events[event].forEach(listener => listener(data));
                }

                Object.defineProperties(dialog, {
                    on: {
                        value: on,
                        writable: false,
                        configurable: false
                    },
                    off: {
                        value: off,
                        writable: false,
                        configurable: false
                    }
                });
                Object.defineProperty(dialog, "showDialog", {
                    value: _ => {
                        dialog.classList.remove("hidden");
                        emit("visibilitychange", true);
                    },
                    writable: false,
                    configurable: false
                });
                Object.defineProperty(dialog, "hideDialog", {
                    value: _ => {
                        dialog.classList.add("hidden");
                        emit("visibilitychange", false);
                    },
                    writable: false,
                    configurable: false
                });

                const bbox = dialog.querySelector("div.bbox");
                
                if (hideOnOffsideTouch) {
                    bbox.onclick = _ => {
                        dialog.hideDialog();
                    };
                }
            }
            prepareDialog(dialog_linkList);

            function openMoreLinksDialog(title, links = [], desc) {
                dialog_linkList.showDialog();
                
                dialog_linkListTitle.textContent = title;
                if (desc) dialog_linkListDesc.textContent = desc;
                dialog_linkListList.innerHTML = "";
                links.filter(p => p.url != "").forEach(v => {
                    const container = document.createElement("a");
                    container.classList = "item";
                    container.href = v.url;
                    container.target = "_blank";

                    const name = document.createElement("p");
                    name.classList = "underline-hover";
                    name.textContent = v.name;
                    container.appendChild(name);

                    const urlp = document.createElement("p");
                    urlp.classList = "overflow link-small";
                    urlp.textContent = v.url;
                    container.appendChild(urlp);

                    dialog_linkListList.appendChild(container);
                });
            }
        </script>
        <script type="module" src="/assets/scripts/lnk_v2.mjs"></script>
